[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --cov=backend/app --cov-fail-under=75 --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring live services",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",   # within except clause, raise ... from err
    "E402",   # module level import not at top of file (needed for load_dotenv)
    "N815",   # variable in class scope should not be mixedCase (needed for API models)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]  # allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "secureeval"
version = "2.5.0"
description = "AI-Powered Exam Proctoring Platform with computer vision and Gemini AI integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "firebase-admin>=6.5.0,<7.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
    "passlib>=1.7.4,<2.0.0",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "pytesseract>=0.3.10,<1.0.0",
    "pillow>=10.4.0,<12.0.0",
    "pdf2image>=1.17.0,<2.0.0",
    "google-generativeai>=0.8.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
]

